apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sample-app.fullname" . }}
  labels:
    {{- include "sample-app.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "sample-app.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "sample-app.labels" . | nindent 8 }}
      annotations:
        # Roll the pods whenever the synced secret changes, so a rotated
        # APP_GREETING actually takes effect instead of waiting for the next
        # image bump.
        checksum/secret-name: {{ .Values.externalSecret.targetName | sha256sum }}
    spec:
      securityContext:
        runAsNonRoot: true
        # runAsNonRoot can only be enforced against a numeric UID. The
        # distroless image declares its user by name ("nonroot"), which the
        # kubelet refuses to start rather than guess about. 65532 is that
        # user's UID, stated here so the guarantee does not depend on how the
        # image spells it.
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: APP_ENV
              value: {{ .Values.environment | quote }}
          envFrom:
            # Supplies APP_GREETING. External Secrets Operator creates this
            # Secret from AWS Secrets Manager — if it is missing or the key is
            # wrong, the readiness probe below fails and ArgoCD goes Degraded.
            - secretRef:
                name: {{ .Values.externalSecret.targetName }}
          # Liveness only asks "is the process alive" — a misconfigured pod
          # should not be restart-looped, it should be held out of service.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          # Readiness asks "is it alive AND correctly configured".
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
