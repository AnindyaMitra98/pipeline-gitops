{{- if .Values.externalSecret.enabled }}
# Pulls the app's runtime config out of AWS Secrets Manager and materialises it
# as a normal Kubernetes Secret. Nothing secret is ever committed to this repo —
# only the *reference* to where the value lives.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "sample-app.fullname" . }}
  labels:
    {{- include "sample-app.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecret.storeName }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.externalSecret.targetName }}
    creationPolicy: Owner
  dataFrom:
    - extract:
        # e.g. pipeline-app/dev — the JSON keys in that secret become env vars.
        key: {{ .Values.externalSecret.remoteKey }}
{{- end }}
